<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OOOF 永生之后 ∞ 数字星河档案</title>
<style>
  :root{
    /* mobius.blog palette — measured from live page (Computed panel) */
    --paper:rgb(230,224,211);        /* body background */
    --paper-2:rgb(223,216,201);      /* slightly deeper panel */
    --ink:rgb(51,47,42);             /* body text color */
    --ink-soft:rgb(90,84,74);
    --ink-faint:rgb(140,132,118);
    --line:rgb(205,197,181);
    --line-soft:rgb(216,209,194);
    --accent:rgb(51,47,42);          /* strokes stay ink, not colour */
    --node-core:rgb(51,47,42);
    --node-1:rgb(107,99,87);         /* 可视化实践 */
    --node-2:rgb(138,127,111);       /* 教学与著作 */
    --node-3:rgb(163,151,132);       /* 社群与公益 */
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Menlo",monospace;
    /* mobius uses Noto Serif SC for BOTH body and headings */
    --serif:"Noto Serif SC","Songti SC","Noto Serif CJK SC",serif;
    --sans:"Noto Serif SC","Songti SC","Noto Serif CJK SC",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
    font-size:16px;
    padding-bottom:64px;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:0 28px}

  /* ---- top bar ---- */
  .topbar{border-bottom:1px solid var(--line);}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:52px;}
  .brand{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);}
  .nav{display:flex;gap:20px;font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);}
  .nav span{transition:color .2s}
  .nav span:hover{color:var(--ink)}

  /* ---- masthead ---- */
  header.mast{padding:64px 0 40px;}
  .kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:26px;}
  h1.title{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.2;letter-spacing:.01em;margin-bottom:22px;}
  .date{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin-bottom:22px;}
  .lede{font-size:17px;color:var(--ink-soft);max-width:60ch;}
  .lede b{color:var(--ink);font-weight:600;}
  .tags{margin-top:26px;font-family:var(--mono);font-size:12px;color:var(--ink-faint);display:flex;gap:14px;flex-wrap:wrap;}
  .tags a::before{content:"/";color:var(--line);margin-right:2px;}

  hr.rule{border:none;border-top:1px solid var(--line);margin:44px 0;}
  .dots{text-align:center;color:var(--ink);font-family:serif;font-size:13.6px;font-weight:300;line-height:13.6px;margin:48px 0;}
  .dots::after{content:"\1F702\1F703\1F701\1F704";letter-spacing:15.3px;padding-left:15.3px;}
